[project]
name = "django-version-detection"
version = "0.1.0"
description = "Guess a website's Django version from admin static file signatures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click",
    "more-itertools>=11.1.0",
    "natsort>=8.4.0",
    "platformdirs>=4.11.8",
    "requests",
    "structlog",
    "tabulate",
]

[project.scripts]
django-version = "django_version_detection.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.13.4"
constraint-dependencies = ["certifi>=2026.10.19"]
exclude-newer-package = { certifi = false }
